[project]
name = "food_db"
version = "0.1.0"
description = "Local nutritional facts database with OCR/NLP ingestion, CLI CRUD, and Streamlit UI."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "NC"}]

dependencies = [
    "nltk>=3.9.3",
    "numpy>=2.4.2",
    "opencv-python>=4.13.0.92",
    "pandas>=2.2.0",
    "pillow>=12.1.1",
    "pillow-heif>=1.2.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pytesseract>=0.3.13",
    "pytest>=9.0.2",
    "python-dotenv>=1.2.1",
    "rich>=13.7.0",
    "sqlalchemy>=2.0.47",
    "streamlit>=1.31.0",
    "typer>=0.24.1",
]

[project.scripts]
fooddb = "food_db.cli.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/food_db"]
